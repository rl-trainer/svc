
spring.application.name=rl-trainer-svc
server.port=8080

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Fail fast at startup if entities don't match the actual schema
spring.jpa.hibernate.ddl-auto=validate

# Hikari Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=604800000
security.cookie.secure=false

# Front end
app.frontend-url=http://localhost:3000/account